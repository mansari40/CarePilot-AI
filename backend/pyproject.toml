[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcare-backend"
version = "0.1.0"
description = "AgentCare — Agentic AI for Patient Administration and Care Coordination"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "email-validator>=2.0,<3.0",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-postgres>=3.0,<4.0",
    "langchain-groq>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]